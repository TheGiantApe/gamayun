            <section class="tool-card">
                <h2>&gt; DECISION_WHEEL</h2>
                <p style="color: var(--phosphor-dim-text); font-size:0.85rem;">One option per line. Add an optional weight with a trailing bar and number - "Pizza | 3" is three times as likely as a plain line - anything without one defaults to weight 1. Selection uses the same cryptographic random source as the rest of this site, not Math.random().</p>
                <div class="tool-workspace">
                    <textarea id="wheel-input" placeholder="Pizza&#10;Tacos&#10;Sushi | 2&#10;Burgers" oninput="redrawWheelFromInput()">Pizza
Tacos
Sushi | 2
Burgers</textarea>
                </div>
                <button onclick="executeWheelSpin()">&gt; SPIN</button>
                <div style="margin-top:1.5rem; display:flex; flex-direction:column; align-items:center;">
                    <div style="color:var(--phosphor); font-size:1.4rem; line-height:1;">&#9660;</div>
                    <canvas id="wheel-canvas" width="320" height="320" style="max-width:100%;"></canvas>
                </div>
                <div class="result-block" id="wheel-result" style="text-align:center; font-size:1.1rem;"></div>
