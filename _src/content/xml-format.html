            <section class="tool-card">
                <h2>&gt; XML_FORMATTER</h2>
                <p style="color: var(--phosphor-dim-text); font-size:0.85rem;">Beautify or minify XML, with the browser's own real parse error (line/column included) instead of a bare "invalid XML."</p>

                    <textarea id="xml-input" placeholder="&lt;root&gt;&lt;item&gt;text&lt;/item&gt;&lt;/root&gt;" oninput="executeXmlFormatDebounced()"></textarea>

                <div style="margin-top:0.5rem; display:flex; gap:1rem; flex-wrap:wrap;">
                    <label style="font-size:0.85rem; color:var(--phosphor-dim-text);">

                    <label style="font-size:0.85rem; color:var(--phosphor-dim-text);">
