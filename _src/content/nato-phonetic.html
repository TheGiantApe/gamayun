            <section class="tool-card">
                <div class="badge-clientside">&#128274; 100% CLIENT-SIDE</div>
                <h2>&gt; NATO_PHONETIC</h2>
                <p style="color: var(--phosphor-dim-text); font-size:0.85rem;">ICAO/NATO spelling alphabet, both directions. Spaces encode as "/"; decoding is case-insensitive and loses the original casing (the alphabet is spoken, not written).</p>
                <div class="tool-workspace">
                    <textarea id="nato-input" placeholder="text, or phonetic words separated by spaces..."></textarea>
                </div>
                <div style="margin-top:0.5rem;">
                    <button onclick="executeNatoEncode()">&gt; TEXT &rarr; PHONETIC</button>
                    <button onclick="executeNatoDecode()">&gt; PHONETIC &rarr; TEXT</button>
                </div>
                <div class="result-block" id="nato-result"></div>
            </section>
