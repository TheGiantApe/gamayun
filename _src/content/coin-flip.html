            <section class="tool-card">
                <h2>&gt; COIN_FLIP</h2>
                <p style="color: var(--phosphor-dim-text); font-size:0.85rem;">Single flips or a batch, with a running tally - most simple flippers only do one coin at a time and throw away the count.</p>
                <div class="tool-workspace">
                    <button onclick="executeCoinFlip(1)">&gt; FLIP ONE</button>
                    <button onclick="executeCoinFlip(10)">&gt; FLIP 10</button>
                    <button onclick="executeCoinFlip(100)">&gt; FLIP 100</button>
                    <button onclick="resetCoinTally()">&gt; RESET TALLY</button>
                </div>
                <div class="result-block" id="coin-result" style="text-align:center; font-size:1.4rem;"></div>
                <div id="coin-tally" style="margin-top:0.75rem; font-size:0.9rem; color:var(--phosphor-dim-text);"></div>
            </section>
