            <section class="tool-card">
                <h2>&gt; RUNES</h2>
                <p style="color: var(--phosphor-dim-text); font-size:0.85rem;">Transliterates text into Elder Futhark (the 24-rune Germanic alphabet, ~150-800 CE). C/Q/V/X/Y have no dedicated rune, so they're mapped to the nearest phonetic equivalent - an approximation, not a scholarly standard.</p>
                <div class="tool-workspace">
                    <input type="text" id="runes-input" placeholder="GAMA" oninput="executeRunes()">
                </div>
                <pre class="result-block" id="runes-result" style="font-size:1.4rem;"></pre>
            </section>
