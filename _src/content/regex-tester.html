            <section class="tool-card">
                <div class="badge-clientside">&#128274; 100% CLIENT-SIDE</div>
                <h2>&gt; REGEX_TESTER</h2>
                <p style="color: var(--phosphor-dim-text); font-size:0.85rem;">Live matching against your browser's own regex engine. All matches highlighted, with capture groups and named groups broken out below.</p>
                <div class="tool-workspace">
                    <input type="text" id="regex-pattern" placeholder="pattern, no slashes" oninput="executeRegexTest()" style="max-width:300px;">
                    <input type="text" id="regex-flags" placeholder="flags (gimsuy)" oninput="executeRegexTest()" style="max-width:150px;">
                </div>
                <div class="tool-workspace">
                    <textarea id="regex-test-string" placeholder="test string..." oninput="executeRegexTest()"></textarea>
                </div>
                <div style="color:var(--phosphor-dim); font-size:0.85rem; margin-top:0.5rem;">preview:</div>
                <pre class="result-block" id="regex-highlight" style="white-space:pre-wrap;"></pre>
                <div class="result-block" id="regex-result"></div>
            </section>
