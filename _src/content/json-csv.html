            <section class="tool-card">
                <h2>&gt; JSON_CSV_CONVERTER</h2>
                <p style="color: var(--phosphor-dim-text); font-size:0.85rem;">Flat or nested JSON arrays &harr; CSV. Nested objects/arrays flatten to dot-notation keys (address.city) instead of choking, which is where a lot of simple converters give up.</p>
                <div class="tool-workspace">
                    <textarea id="jsoncsv-input" placeholder='[{"name":"Ana","address":{"city":"Reno"}}]' oninput="executeJsonCsvDebounced()"></textarea>
                </div>
                <div style="margin-top:0.5rem; display:flex; gap:1rem; flex-wrap:wrap;">
                    <label style="font-size:0.85rem; color:var(--phosphor-dim-text);">
                        <input type="radio" name="jsoncsv-mode" value="json2csv" checked onchange="executeJsonCsvDebounced()"> JSON &rarr; CSV
                    </label>
                    <label style="font-size:0.85rem; color:var(--phosphor-dim-text);">
                        <input type="radio" name="jsoncsv-mode" value="csv2json" onchange="executeJsonCsvDebounced()"> CSV &rarr; JSON
                    </label>
                </div>
                <pre class="result-block" id="jsoncsv-result" style="overflow-x:auto;"></pre>
            </section>
            <p style="padding:0 1.5rem; font-size:0.85rem;"><span style="color: var(--phosphor-dim-text)">See also:</span> <a href="json-format.html">JSON Formatter</a> &middot; <a href="text-diff.html">Text Diff</a></p>
