            <section class="tool-card">
                <h2>&gt; QR_GEN</h2>
                <p style="color: var(--phosphor-dim-text); font-size:0.9rem;">Encode any text or URL as a QR code. Real ISO 18004 encoder (Reed-Solomon error correction, not a lookup image) - versions 1 through 40, auto-sized to fit.</p>
                <div class="tool-workspace">
                    <textarea id="qr-input" placeholder="paste a URL or type anything..." oninput="executeQrGen()"></textarea>
                </div>
                <div style="margin-top:0.5rem; display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap;">
                    <label style="font-size:0.85rem; color:var(--phosphor-dim-text);">error correction:
                        <select id="qr-ec-level" onchange="executeQrGen()">
                            <option value="L">L (7% recovery, max capacity)</option>
                            <option value="M" selected>M (15% recovery)</option>
                            <option value="Q">Q (25% recovery)</option>
                            <option value="H">H (30% recovery, best for damaged/dirty print)</option>
                        </select>
                    </label>
                </div>
                <div id="qr-result" style="margin-top:1rem;"></div>
                <button id="qr-download-btn" onclick="downloadQrPng()" style="display:none; margin-top:0.75rem;">&gt; DOWNLOAD PNG</button>
            </section>
