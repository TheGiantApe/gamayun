                <p style="color: var(--phosphor-dim-text); font-size:0.85rem;">Pipe text through a sequence of operations, each step feeding the next. Base64, URL, HTML entities, hex, ROT13, XOR, SHA-256 - stack them in any order and watch every intermediate value.</p>
