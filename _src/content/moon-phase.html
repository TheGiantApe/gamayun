            <section class="tool-card">
                <h2>&gt; MOON_PHASE</h2>
                <p style="color: var(--phosphor-dim-text); font-size:0.85rem;">Phase, illumination %, and days to the next full/new moon for any date. Mean synodic-month approximation - accurate to within about a percentage point of illumination, not eclipse-prediction grade.</p>
