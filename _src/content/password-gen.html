            <section class="tool-card">
                <h2>&gt; PASSWORD_GEN</h2>
                <p style="color: var(--phosphor-dim-text); font-size:0.85rem;">Real cryptographic random source (crypto.getRandomValues, rejection-sampled), not Math.random().</p>
                <div class="tool-workspace">
                    <label style="font-size:0.85rem; color:var(--phosphor-dim-text);">length:
                        <input type="number" id="pw-length" value="16" min="4" max="128" style="max-width:100px;">
                    </label>
                </div>
                <div style="margin-top:0.5rem; display:flex; flex-wrap:wrap; gap:1rem; font-size:0.85rem; color:var(--phosphor-dim-text);">
                    <label><input type="checkbox" id="pw-lower" checked> lowercase</label>
                    <label><input type="checkbox" id="pw-upper" checked> UPPERCASE</label>
                    <label><input type="checkbox" id="pw-digits" checked> digits</label>
                    <label><input type="checkbox" id="pw-symbols" checked> symbols</label>
                    <label><input type="checkbox" id="pw-exclude-ambiguous"> exclude ambiguous (il1Lo0O)</label>
                </div>
                <div style="margin-top:0.75rem;">
                    <button onclick="executePasswordGen()">&gt; GENERATE</button>
                </div>
                <pre class="result-block" id="pw-result"></pre>
                <p id="pw-entropy" style="padding:0 1.5rem; font-size:0.8rem; color:var(--phosphor-dim-text);"></p>
            </section>
