            <section class="tool-card tool-card--wide">
                <h2>&gt; EASING_VISUALIZER</h2>
                <p style="color: var(--phosphor-dim-text); font-size:0.85rem;">Adjust the four cubic-bezier control points and watch both the curve and an actual moving element, side by side - a preset library covers the common named curves too.</p>
                <div class="tool-workspace control-row">
                    <button onclick="setEasingPreset(0.25,0.1,0.25,1)">ease</button>
                    <button onclick="setEasingPreset(0.42,0,1,1)">ease-in</button>
                    <button onclick="setEasingPreset(0,0,0.58,1)">ease-out</button>
                    <button onclick="setEasingPreset(0.42,0,0.58,1)">ease-in-out</button>
                    <button onclick="setEasingPreset(0.55,0.085,0.68,0.53)">easeInQuad</button>
                    <button onclick="setEasingPreset(0.25,0.46,0.45,0.94)">easeOutQuad</button>
                    <button onclick="setEasingPreset(0.68,-0.55,0.265,1.55)">easeInOutBack</button>
                </div>
                <div class="tool-workspace" style="flex-wrap:wrap; margin-top:0.5rem;">
                    <label style="font-size:0.8rem; color:var(--phosphor-dim-text);">x1 <input type="range" id="ease-x1" min="0" max="100" value="25" oninput="renderEasing()"></label>
                    <label style="font-size:0.8rem; color:var(--phosphor-dim-text);">y1 <input type="range" id="ease-y1" min="-100" max="200" value="10" oninput="renderEasing()"></label>
                    <label style="font-size:0.8rem; color:var(--phosphor-dim-text);">x2 <input type="range" id="ease-x2" min="0" max="100" value="25" oninput="renderEasing()"></label>
