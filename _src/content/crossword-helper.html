            <section class="tool-card">

                <p style="color: var(--phosphor-dim-text); font-size:0.85rem;">Standard crossword blank notation, directly - use <code>_</code> or <code>?</code> for unknown letters (e.g. <code>c_t</code> or <code>c?t</code>). No reformatting required, unlike most "word finder" tools.</p>
